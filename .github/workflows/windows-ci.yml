name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Release
        run: cmake --preset windows-x64-release

      - name: Build Release
        run: cmake --build --preset windows-x64-release

      - name: Run tests
        run: ctest --test-dir out/build/windows-x64-release -C Release --output-on-failure

      - name: Validate and render UI layouts
        run: |
          cmake --build --preset windows-x64-release --target nexplay_ui_preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./out/build/windows-x64-release/Release/nexplay_ui_preview.exe ./out/ui-preview

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: NexPlay-ui-previews
          path: out/ui-preview/*.png
          if-no-files-found: error

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NexPlay-windows-x64
          path: out/build/windows-x64-release/Release/nexplay.exe
          if-no-files-found: error
